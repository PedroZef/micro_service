<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Detalhes do Produto</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 0;
            font-size: 16px;
            background-color: #f4f4f4;
            color: #333;

            align-items: center;
            display: flex;
            justify-content: center;
        }

        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 20px;
            background-color: #fff;
            box-shadow: 0 2px 3px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
            border-radius: 5px;
        }

        h1 {
            text-align: center;
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        .product-details p {
            font-size: 1.2em;
            line-height: 1.6;
            border-bottom: 1px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }

        .product-details strong {
            display: inline-block;
            width: 120px;
            color: #555;
        }

        .error {
            color: red;
            font-size: 1.2em;
            font-weight: bold;
            text-align: center;
            padding: 10px;
            background-color: #ffdddd;
            border: 1px solid red;
        }

        .back-link {
            display: inline-block;
            margin-top: 20px;
            text-decoration: none;
            text-align: center;
            background-color: #6c757d;
            color: white;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.3s;
        }

        .back-link:hover {
            background-color: #5a6268;
        }
    </style>
</head>

<body>
    <div class="container">
        <div th:if="${erro}" class="error">
            <p th:text="${erro}"></p>
        </div>

        <div th:if="${produto}">
            <h1>Detalhes do Produto</h1>
            <div class="product-details">
                <p><strong>ID:</strong> <span th:text="${produto.id}">1</span></p>
                <p><strong>Nome:</strong> <span th:text="${produto.nome}">Nome do Produto</span></p>
                <p><strong>Descrição:</strong> <span th:text="${produto.descricao}">Descrição do Produto</span></p>
                <p><strong>Preço:</strong> <span
                        th:text="${'R$ ' + #numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">R$
                        99,99</span></p>
                <p><strong>Estoque:</strong> <span th:text="${produto.quantidadeEmEstoque}">10</span></p>
            </div>
        </div>

        <a href="/" class="back-link">Voltar para a Vitrine</a>
    </div>
</body>

</html>
